spring.datasource.url= jdbc:mysql://${BBDD_HOST:localhost}:3306/${BBDD_NAME:eduvibe}
spring.jpa.hibernate.ddl-auto= ${DLL_AUTO:update}
spring.datasource.username= ${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${APP_PORT:9090}

spring.mail.host=smtp.gmail.com
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true

# Origenes autorizados para CORS, separados por comas.
# En produccion se pasa la URL del frontend con la variable CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# Secreto de firma del JWT. Si no se define, se genera uno aleatorio al arrancar
# (valido para desarrollo: los tokens dejan de servir al reiniciar).
app.jwt.secret=${JWT_SECRET:}
