<header class="barra">
  <div class="contenedor fila-entre" style="height:60px">

    <a routerLink="/clases" class="marca" (click)="cerrarTodo()">
      <app-logo [size]="30"></app-logo>
    </a>

    <!-- Navegación principal -->
    <nav class="nav" [class.desplegada]="navegacionAbierta()">
      <a *ngFor="let enlace of enlaces()" [routerLink]="enlace.ruta" routerLinkActive="activo"
         class="enlace" (click)="cerrarTodo()">
        {{ enlace.texto }}
      </a>
    </nav>

    <div class="fila espaciado-sm">

      <!-- Tema claro/oscuro -->
      <button type="button" class="boton boton-fantasma" (click)="tema.alternar()"
              [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        <svg *ngIf="tema.tema() === 'oscuro'; else iconoLuna" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <ng-template #iconoLuna>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
        </ng-template>
      </button>

      <app-notificaciones></app-notificaciones>

      <!-- Menú de la persona -->
      <div class="menu-usuario" data-menu-usuario>
        <button type="button" class="disparador" (click)="alternarMenu()"
                [attr.aria-expanded]="menuAbierto()" aria-haspopup="true">
          <app-avatar [nombre]="auth.usuario()?.name || ''" [avatarUrl]="auth.usuario()?.avatarUrl || null" [pequeno]="true"></app-avatar>
          <span class="nombre">{{ auth.usuario()?.name }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
               [class.girado]="menuAbierto()">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>

        <div class="desplegable" *ngIf="menuAbierto()">
          <div class="ficha">
            <p class="fuerte mb-0">{{ auth.usuario()?.name }}</p>
            <p class="pequeno apagado mb-1" style="word-break:break-all">{{ auth.usuario()?.email }}</p>
            <app-pastilla-estado [valor]="auth.usuario()?.role"></app-pastilla-estado>
          </div>
          <a routerLink="/perfil" class="opcion opcion-neutra" (click)="cerrarTodo()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/>
            </svg>
            Mi perfil
          </a>
          <button type="button" class="opcion" (click)="salir()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>

      <!-- Botón de navegación en móvil -->
      <button type="button" class="boton boton-fantasma hamburguesa" (click)="alternarNavegacion()"
              aria-label="Abrir navegación">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>
