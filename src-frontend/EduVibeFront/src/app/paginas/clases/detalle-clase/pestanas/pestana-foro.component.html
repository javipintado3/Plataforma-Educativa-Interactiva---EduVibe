<div class="fila-entre mb-2">
  <p class="pequeno apagado mb-0">Preguntas y debate de la clase, abierto a todo el mundo.</p>
  <button type="button" class="boton boton-primario boton-pequeno" (click)="abrirDialogo()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nuevo hilo
  </button>
</div>

<app-aviso class="mb-2" tipo="error" [mensaje]="error()"></app-aviso>

<app-cargando *ngIf="cargando()"></app-cargando>

<ng-container *ngIf="!cargando()">

  <div class="tarjeta" *ngIf="!hilosVisibles.length">
    <app-estado-vacio
      titulo="Todavía no hay hilos"
      descripcion="Abre el primero para empezar el debate.">
      <button type="button" class="boton boton-suave mt-2" (click)="abrirDialogo()">
        Abrir el primer hilo
      </button>
    </app-estado-vacio>
  </div>

  <div class="tarjeta" *ngIf="hilosVisibles.length">
    <a class="tarea" *ngFor="let hilo of hilosPagina" [routerLink]="['/foro', hilo.id]">
      <span class="crecer" style="min-width:0">
        <span class="titulo">{{ hilo.title }}</span>
        <span class="meta">
          {{ hilo.authorName }}<ng-container *ngIf="temaFiltro === undefined"> · {{ tituloDelTema(hilo.topicId) }}</ng-container>
          <span class="apagado"> · última actividad {{ hilo.lastActivityAt | fecha }}</span>
        </span>
      </span>

      <span class="pastilla pastilla-gris">{{ hilo.postCount }} mensaje(s)</span>
    </a>
  </div>

  <app-paginador [pagina]="paginaVisible" [totalPaginas]="totalPaginas"
    [totalElementos]="hilosVisibles.length" etiqueta="hilo(s)"
    (cambio)="paginaActual.set($event)"></app-paginador>
</ng-container>

<!-- Alta de hilo -->
<app-dialogo [abierto]="dialogoAbierto()" titulo="Nuevo hilo"
             [cierraAlPulsarFuera]="false" (cerrar)="dialogoAbierto.set(false)">

  <app-aviso class="mb-2" tipo="error" [mensaje]="errorFormulario()"></app-aviso>

  <form [formGroup]="formulario" (ngSubmit)="crear()" novalidate id="form-hilo">

    <div class="campo">
      <label class="etiqueta" for="titulo-hilo">Título</label>
      <input id="titulo-hilo" class="entrada" formControlName="title" placeholder="Duda sobre el ejercicio 4">
    </div>

    <div class="campo">
      <label class="etiqueta" for="mensaje-hilo">Mensaje</label>
      <textarea id="mensaje-hilo" class="area" formControlName="content"
                placeholder="Escribe tu pregunta o el tema a debatir."></textarea>
    </div>

    <div class="campo mb-0" *ngIf="temas.length">
      <label class="etiqueta" for="tema-hilo">{{ etiquetaUnidad }}</label>
      <select id="tema-hilo" class="selector" formControlName="topicId">
        <option value="">{{ etiquetaSinUnidad }}</option>
        <option *ngFor="let tema of temas" [value]="tema.id">{{ tema.title }}</option>
      </select>
    </div>
  </form>

  <ng-container acciones>
    <button type="button" class="boton boton-contorno" (click)="dialogoAbierto.set(false)">Cancelar</button>
    <button type="submit" form="form-hilo" class="boton boton-primario" [disabled]="abriendo()">
      {{ abriendo() ? 'Abriendo…' : 'Abrir hilo' }}
    </button>
  </ng-container>
</app-dialogo>
