<div class="container my-5">
    <h2 class="mb-1">Inicio</h2>
    <p class="page-subtitle mb-4">Un vistazo rápido a tus clases</p>
    <div class="row justify-content-center"> <!-- Centrar las tarjetas -->
        <div class="col-md-5 mb-4" *ngFor="let clase of clases | paginate: { itemsPerPage: 2, currentPage: p }; let i = index">
            <div class="card class-card">
                <div class="class-banner" [class]="'banner-' + (i % 4)">
                    <span class="class-initial">{{ clase.nombre.charAt(0) }}</span>
                </div>
                <div class="card-body">
                    <h5 class="card-title"><a [routerLink]="['/clase', clase.idClase]">{{ clase.nombre }}</a></h5>
                    <p class="card-text">{{ clase.descripcion }}</p>
                    <div class="card-buttons">
                        <a [routerLink]="['/clase', clase.idClase]" class="btn btn-primary">Tareas</a>
                        <a [routerLink]="['/calificaciones', clase.idClase]" class="btn btn-secondary">Calificaciones</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="mx-auto me-5 mt-4 mb-2 justify-content-center d-flex">
        <pagination-controls class="paginacion" [autoHide]="true" [responsive]="true" [maxSize]="5"
            (pageChange)="p = $event"></pagination-controls>
    </div>
</div>
