<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Eduvibe</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma educativa: clases, tareas y calificaciones en un solo sitio.">
  <meta name="theme-color" content="#059669">

  <!-- El logotipo, en SVG, sirve también de icono de pestaña: un solo
       archivo de medio kilobyte que se ve nítido a cualquier tamaño -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Se establece la conexión con el servidor de fuentes antes de que haga
       falta, para que el texto no aparezca con la tipografía de reserva -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Aplica el tema antes de que Angular arranque: sin esto, una recarga en
       modo oscuro se ve un instante en claro y luego cambia de golpe. -->
  <script>
    (function () {
      var guardado = localStorage.getItem('eduvibe-tema');
      var oscuro = guardado ? guardado === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-tema', oscuro ? 'oscuro' : 'claro');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
